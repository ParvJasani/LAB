<!DOCTYPE html>
<html lang="en">
<head>

    <title>css use</title>
    <style>

        }
        .rside{

        }

</head>

        <div class="content">

                <div class="entry">Entry</div>
                <div class="entry">Entry</div>
            </div>

        </div>
