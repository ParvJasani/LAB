<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>employee registration</title>
</head>
<body align="center">
    <h2>Eployee Regisrtation</h2>
    <h4>Personal Details</h4>
    <table align="center" cellpadding="10">
        <form>
            <tr>
                <td><label for="employee id">Employee Id </label></td>
                <td>:</td>
                <td><input type="text" name="employee id" id="employee id" placeholder="Enter Employee Id" required></td>
                <td></td>
                <td><label for="employee name">Employee Name</label></td>
                <td>:</td>
                <td><input type="text" name="employee name" id="employee name" placeholder="Enter Employee Name"required></td>
            </tr>
            <tr>
                <td><label for="email">Email </label></td>
                <td>:</td>
                <td><input type="email" id="email" placeholder="Enter Email"required></td>
                <td></td>
                <td><label for="contact no.">Contact no.</label></td>
                <td>:</td>
                <td><input type="number" name="contact no." id="contact no." placeholder="Enter contact no."required></td>
            </tr>
            <tr>
                <td><label for="Ms">Marital Status</label></td>
                <td>:</td>
                <td><input type="radio" name="Ms" id="Ms" value="single">Single
                    <input type="radio" name="Ms" id="Ms" value="married">married</td>
            </tr>
            <th colspan="8">Education Qualification</th>
            <tr>
                <td><label for="ed">Education</label></td>
                <td>:</td>
                <td><input type="text" name="ed" id="ed" placeholder="Enter Education details"required></td> 
                <td></td>
                <td><label for="ex">Experience</label></td>
                <td>:</td>
                <td><input type="text" name="ex" id="ex" placeholder="Enter your Experience"required></td>             
            </tr>
            <th colspan="8">Jobs Details</th>
            <tr>
                <td><label for="de">Designation</label></td>
                <td>:</td>
                <td><input type="text" name="de" id="de" placeholder="Enter your designation"required></td> 
                <td></td>
                <td><label for="jk">Job Location </label></td>
                <td>:</td>
                <td><input type="text" name="jk" id="jk" placeholder="Enter Job Location"required></td> 
            </tr>
            <tr>
                <td><label for="salary">Salary</label></td>
                <td>:</td>
                <td><input type="text" name="salary" id="salary" placeholder="Enter your salary"required></td> 
            </tr>
            <tr>
                <td colspan="90"><hr></td>
            </tr>
                
            <tr>
                <td colspan="8"><input type="submit" value="register"></td>
            </tr>
        </form>
    </table>
</body>
</html>
