<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Lab 14-B</title>
    <style>

        .logo{
            font-size: 30px;
            Font-family : Montserrat, sans-serif;
            color: white;
            
        }
        header{
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            height: 60px;
            padding-top: 20px;
        }
        .leftside{
            display: flex;
            gap: 15px;
            font-size:smaller;
            padding-top: 10px;
        }
        button{
            background-color: rgb(17, 164, 180);
            color:white;
            border-radius: 30px;
            padding: 0px 10px 0px 10px;
        }
        .apps{
            color: rgb(17, 164, 180);
            font-size:larger;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fa-solid fa-guitar"></i>SoundAMP</div>
        <div class="leftside">
            <div>HTML Templates<i class="fa-solid fa-caret-down"></i></div>
            <div>More HTML Templetes<i class="fa-solid fa-caret-down"></i></div>
            <div><button>Download</button></div>
            <div class="apps"><i class="fa-brands fa-instagram"></i></div>
            <div class="apps"><i class="fa-brands fa-linkedin"></i></div>
        </div>
    </header>
</body>
</html>
