<html>
    <head>
        <title>types of list</title>
    </head>
    <body>
        <h1>UNORDERD LIST</h1>
        <ul>
        <li type="square">cricket</li>
        <li type="circle">football</li>
        <li type="triangle">chess</li>
        </ul>
        <h1>ORDERED LIST</h1>
        <ol>
        <li>gta 5</li>
        <li>pubg</li>
        <li>minecreaft</li>
        </ol>

        <h1>DEFINATION LIST</h1>
        <dl>
            <dt>NEWS</dt>
            <dd>North East West South</dd>
        </dl>

        </dl>
        
    </body>
</html>
