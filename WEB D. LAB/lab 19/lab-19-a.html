<!doctype html>
<html lang="en">
  <head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <body>
    <div class="container bg-secondary-subtle pb-5 d-flex flex-column justify-content-center align-item-center">

        <div class="h1 text-center">Please Sign In</div>
        <div class="" style="margin-left:350px"><input type="text" id="disabledTextInput" class="form-control w-50 mt-2 " placeholder="Email Address"></div>
        <div class="text-center" style="margin-left:350px"><input type="text" id="password" class="form-control w-50 mt-2" placeholder="password"></div>
        <div class="form-check mt-2">
            <input style="margin-left:420px" class="form-check-input" type="checkbox" id="disabledFieldsetCheck" disabled>
            <label class="form-check-label" for="Remember Me">Remember Me
        </div>
          <button style="margin-left:410px" type="submit" class="btn btn-primary w-25 mt-2">Sign In</button>
          <div class="text-center m-4 text-muted">&copy; 2017-2018</div>
    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
