<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <class class="h1">Complex Bootstrap Form</class>
    <div class="container">
        <div class="row mt-4">
            <div class="col">
                <label for="exampleFormControlInput1" class="form-label">First Name</label>
                <input class="form-control" type="text" placeholder="Enter Your First Name" aria-label="default input example">
            </div>
            <div class="col">
                <label for="exampleFormControlInput1" class="form-label">Last Name</label>
                <input class="form-control" type="text" placeholder="Enter Your Last Name" aria-label="default input example">
            </div>
        </div>
        <div class="mt-3">
            <label for="exampleFormControlInput1" class="form-label">Email</label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter Your Email">
          </div>
          <div class="row mt-4">
            <div class="col">
                <label for="exampleFormControlInput1" class="form-label">Password</label>
                <input class="form-control" type="text" placeholder="Enter Your Password" aria-label="default input example">
            </div>
            <div class="col">
                <label for="exampleFormControlInput1" class="form-label">Confirm Password</label>
                <input class="form-control" type="text" placeholder="Confirm Your Password" aria-label="default input example">
            </div>
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter Your Address">
              </div>
            <div class="row mt-3">
                <div class="col-6">
                    <label for="exampleFormControlInput1" class="form-label">City</label>
                <input class="form-control" type="text" placeholder="" aria-label="default input example">
                </div>
                <div class="col-4">
                    <label for="exampleFormControlInput1" class="form-label">State</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>choose....</option>
                        <option value="1">Gujrat</option>
                        <option value="2">Maharastra</option>
                        <option value="3">M.P.</option>
                      </select>
                      
                </div>
                <div class="col-2">
                    <label for="exampleFormControlInput1" class="form-label">Zip</label>
                <input class="form-control" type="text" placeholder="" aria-label="default input example">
                </div>
            </div>
            <div class="form-check ms-3 mt-3">
                <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                  Check Me Out
                </label>
              </div>
            <button type="button" class="btn btn-primary w-auto ms-2 mt-3">Sign Up</button>
        </div>
          
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
